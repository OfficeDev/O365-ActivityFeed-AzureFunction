  <rect x="976" y="48" width="464" height="772" fill="#fff"/>
  <line x1="976" y1="48" x2="976" y2="820" class="line"/>
  <g class="ui">
    <text x="1000" y="92" class="subheading">Activity Details</text>
    <text x="1000" y="126" class="label">Activity started</text>
    <text x="1000" y="148" class="small">10 Aug 2026 15:59</text>
    <text x="1215" y="126" class="label">Type</text>
    <text x="1215" y="148" class="small">Comment</text>

    <text x="1000" y="184" class="label">Title</text>
    <text x="1000" y="206" class="small">Detection Assurance AI triage — human review required</text>
    <text x="1000" y="242" class="label">Performed by</text>
    <text x="1000" y="264" class="small">security-operator@example.com</text>
    <text x="1215" y="242" class="label">Trigger</text>
    <text x="1215" y="264" class="small">Manual</text>

    <text x="1000" y="305" class="label">Activity status</text>
    <text x="1215" y="305" class="label">Comments</text>
    <text x="1215" y="331" class="small">Detection Assurance AI triage —</text>
    <text x="1215" y="349" class="small">human review required</text>
    <text x="1215" y="375" class="small" font-weight="650">Priority: LOW</text>
    <text x="1215" y="395" class="small">Disposition: NOISE</text>
    <text x="1215" y="415" class="small">Credential validity: INDETERMINATE</text>
    <text x="1215" y="443" class="small">Security assessment: Evidence is</text>
    <text x="1215" y="461" class="small">consistent with an approved tracking</text>
    <text x="1215" y="479" class="small">and forwarding pattern in email body,</text>
    <text x="1215" y="497" class="small">not credential-bearing material.</text>
    <text x="1215" y="525" class="small">Evidence is insufficient; protected</text>
    <text x="1215" y="543" class="small">validation is required before tuning.</text>
    <text x="1215" y="573" class="small">Source: profile=Credentials;</text>
    <text x="1215" y="591" class="small">assessment=example-period</text>
    <text x="1215" y="621" class="small">No detected values or sensitive</text>
    <text x="1215" y="639" class="small">artifacts are included in this comment.</text>
