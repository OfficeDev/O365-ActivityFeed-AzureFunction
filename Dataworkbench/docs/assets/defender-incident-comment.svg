    <text x="1215" y="29" font-size="16">♧   ♧   ⚙   ?</text>
    <circle cx="1402" cy="24" r="14" fill="#444" stroke="#aaa"/>
    <text x="1395" y="29" class="small" fill="#fff">OP</text>
  </g>

  <rect x="0" y="48" width="56" height="772" fill="#fafafa"/>
  <rect x="56" y="48" width="240" height="772" fill="#fff"/>
