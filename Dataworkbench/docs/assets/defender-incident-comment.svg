<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">Sanitized Microsoft Defender incident activity with a Detection Assurance comment</title>
  <desc id="desc">Illustrative Defender incident page showing a privacy-safe Detection Assurance AI triage comment in the activity timeline and details pane.</desc>
  <defs>
    <style>
      .ui { font-family: "Segoe UI", Arial, sans-serif; fill: #242424; }
      .small { font-size: 12px; }
      .body { font-size: 14px; }
      .label { font-size: 12px; fill: #5b5b5b; }
      .heading { font-size: 25px; font-weight: 700; }
      .subheading { font-size: 16px; font-weight: 650; }
      .nav { font-size: 13px; }
      .muted { fill: #666; }
      .blue { fill: #0f6cbd; }
      .green { fill: #107c10; }
      .line { stroke: #e2e2e2; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1440" height="820" fill="#f5f5f5"/>
  <rect width="1440" height="48" fill="#292827"/>
  <g class="ui" fill="#fff">
    <text x="18" y="31" font-size="20">⠿</text>
    <text x="52" y="30" font-size="15" font-weight="650">Microsoft Defender</text>
    <rect x="500" y="9" width="365" height="30" rx="3" fill="#fff"/>
