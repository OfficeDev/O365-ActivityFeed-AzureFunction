    <text x="419" y="226" class="body">Alerts (1)</text>
    <text x="506" y="226" class="body blue" font-weight="650">Activities (6)</text>
    <text x="603" y="226" class="body">Assets (1)</text>
    <text x="685" y="226" class="body">Investigations (0)</text>
    <line x1="498" y1="240" x2="590" y2="240" stroke="#0f6cbd" stroke-width="3"/>

