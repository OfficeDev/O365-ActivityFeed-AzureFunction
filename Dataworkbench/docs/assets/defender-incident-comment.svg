      <line x1="318" y1="392" x2="960" y2="392" class="line"/>
      <text x="365" y="420">10 Aug 2026 15:59</text><text x="490" y="420">Tags changed to “DLP-Reviewed”</text><text x="793" y="420">Tag change</text>
      <line x1="318" y1="438" x2="960" y2="438" class="line"/>
      <text x="365" y="466">10 Aug 2026 15:59</text><text x="490" y="466">Status changed from “In progress” to “Resolved”</text><text x="793" y="466">Status change</text>
      <line x1="318" y1="484" x2="960" y2="484" class="line"/>
      <text x="365" y="512">10 Aug 2026 15:59</text><text x="490" y="512">Resolved by explicitly approved DLP response</text><text x="793" y="512">Comment</text>
      <line x1="318" y1="530" x2="960" y2="530" class="line"/>
      <text x="365" y="558">10 Aug 2026 15:29</text><text x="490" y="558">Incident assignment updated</text><text x="793" y="558">Assignment change</text>
      <line x1="318" y1="576" x2="960" y2="576" class="line"/>
      <text x="365" y="604">10 Aug 2026 15:29</text><text x="490" y="604">Classification changed after review</text><text x="793" y="604">Classification</text>
