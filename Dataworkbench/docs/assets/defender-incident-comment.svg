    <rect x="332" y="363" width="15" height="15" rx="2" fill="#0f6cbd"/>
    <text x="336" y="376" font-size="11" fill="#fff">✓</text>
    <text x="365" y="375" class="small">10 Aug 2026 15:59</text>
    <text x="490" y="375" class="small">Detection Assurance AI triage — human review required</text>
    <text x="793" y="375" class="small">Comment</text>
    <rect x="866" y="359" width="70" height="20" rx="3" fill="#e8f3fb" stroke="#8abce6"/>
    <text x="878" y="373" class="small blue">▱ Comment</text>

