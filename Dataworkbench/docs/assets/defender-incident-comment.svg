    <text x="74" y="78" font-size="12" fill="#666">Find Defender solutions</text>
    <rect x="69" y="61" width="210" height="32" rx="4" fill="none" stroke="#bbb"/>
    <text x="75" y="124">⌂  Home</text>
    <text x="75" y="154">▣  Cases</text>
    <line x1="69" y1="171" x2="278" y2="171" class="line"/>
    <text x="75" y="201">◇  Exposure management</text>
    <text x="75" y="236">⌾  Investigation &amp; response</text>
    <text x="75" y="276">⌘  Threat intelligence</text>
    <text x="75" y="316">◇  Assets</text>
    <text x="75" y="356">◉  Microsoft Sentinel</text>
    <text x="75" y="396">♙  Identities</text>
    <text x="75" y="436">✉  Email &amp; collaboration</text>
    <text x="75" y="476">☁  Cloud apps</text>
    <text x="75" y="516">◉  Cloud security</text>
    <text x="75" y="556">⌁  SOC optimization</text>
    <text x="75" y="596">▤  Reports</text>
    <text x="75" y="636">▱  Learning hub</text>
    <text x="75" y="676">☷  Trials</text>
    <text x="75" y="716">⌾  More resources</text>
    <line x1="69" y1="741" x2="278" y2="741" class="line"/>
    <text x="75" y="775">⚙  System</text>
  </g>

  <rect x="296" y="48" width="680" height="772" fill="#fff"/>
  <g class="ui">
